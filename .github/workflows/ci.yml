name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format check
        run: make go-fmt-check

      - name: Vet
        run: make go-vet

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

      - name: Test
        run: make go-test

      - name: Build
        run: make go-build

  stylua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua plugin test

  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: lunarmodules/luacheck@v1
        with:
          args: lua

  lua-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # the Makefile fetches a version-pinned lua_ls into .tools; cache it on
      # the pin (keying on the Makefile line that declares it)
      - uses: actions/cache@v4
        with:
          path: .tools/lua-language-server-*
          key: luals-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Type-check
        run: make lua-typecheck

  lua-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # v0.12.0 is the declared floor, pinned rather than tracked: `stable` rolls to
        # 0.13 on release and the floor would silently stop being exercised
        neovim-version: ["v0.12.0", "stable", "nightly"]
    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim-version }}

      # lua 5.1 + luarocks so busted/nlua match the Makefile's headless suite
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1"

      - uses: leafo/gh-actions-luarocks@v6

      - name: Install test deps
        run: |
          luarocks install busted
          luarocks install nlua

      - name: Test
        run: make lua-test
