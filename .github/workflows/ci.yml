name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format check
        run: make go-fmt-check

      - name: Vet
        run: make go-vet

      # the Makefile fetches a version-pinned golangci-lint into .tools, so ci and a
      # local `make check` run the same binary; cache it on the Makefile that pins it
      - uses: actions/cache@v4
        with:
          path: .tools/golangci-lint-*
          key: golangci-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Lint
        run: make go-lint

      - name: Test
        run: make go-test

      - name: Build
        run: make go-build

      - name: Build demo fixture sidecar
        run: make demo-build

  stylua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .tools/stylua-*
          key: stylua-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Format check
        run: make lua-fmt-check

  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # luacheck is a rock and 1.2.0 refuses to load on lua 5.5, so the interpreter is
      # half the pin: 5.1, the version both test suites already run on. the tree isn't
      # cached, since the luarocks wrapper bakes in an interpreter path
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1"

      - uses: leafo/gh-actions-luarocks@v6

      - name: Luacheck
        run: make lua-luacheck

  lua-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # the Makefile fetches a version-pinned lua_ls into .tools; cache it on the
      # Makefile that pins it
      - uses: actions/cache@v4
        with:
          path: .tools/lua-language-server-*
          key: luals-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Type-check
        run: make lua-typecheck

  lua-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # v0.12.0 is the declared floor, pinned rather than tracked: `stable` rolls to
        # 0.13 on release and the floor would silently stop being exercised
        neovim-version: ["v0.12.0", "stable", "nightly"]
    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim-version }}

      # lua 5.1 + luarocks so busted/nlua match the Makefile's headless suite
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1"

      - uses: leafo/gh-actions-luarocks@v6

      - name: Install test deps
        run: |
          luarocks install busted
          luarocks install nlua

      - name: Test
        run: make lua-test
